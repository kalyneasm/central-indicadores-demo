:9px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.toolbar input{min-width:270px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.form label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}.modal

<div class="app"><aside class="side"><div class="brand">CENTRAL DE INDICADORES<small>Governança • Performance • Melhoria</small></div>
<div class="nav"><button class="active" data-view="home">Visão geral</button><button data-view="indicators">▦ Indicadores</button><button data-view="bi">↻ Projetos BI</button><button data-view="validation">✓ Validação</button><button data-view="actions">⚑ Planos de ação</button><button data-view="followup">◎ Acompanhamento</button><button data-view="meetings">▤ Governança</button></div></aside>
<main class="main"><div id="content"></div></main></div><div id="modal" class="modal hidden"></div>
<script>
const APconst API='https://central-indicadores-api.kalyneasm.workers.dev/api', $=s=>document.querySelector(s);
async function get(path){const r=await fetch(API+path);if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){const get=async p=>{const r=await fetch(API+p);if(!r.ok)throw new Error(p+" HTTP "+r.status);return r.json()};try{await get('/health');online=true;const seguro=async(p,padrao)=>{try{return await get(p)}catch(e){console.warn('Falha ao carregar '+p+':',e.message);return padrao}};const [summary,indicators,results,actions,bi,raci,meetings,deliberations,validations]=await Promise.all([seguro('/summary',{}),seguro('/indicators',[]),seguro('/results',[]),seguro('/actions',[]),seguro('/bi',[]),seguro('/raci',[]),seguro('/meetings',[]),seguro('/deliberations',[]),seguro('/bi-validations',[])]);data={summary:summary.data??summary,indicators:indicators.data??indicators,results:results.data??results,actions:actions.data??actions,bi:bi.data??bi,raci:raci.data??raci,meetings:meetings.data??meetings,deliberations:deliberations.data??deliberations,validations:validations.data??validations}}catch(e){online=false;console.error('Falha ao conectar com o servidor:',e.message)}render('home')}
function badge(s){
const t=String(s||'?');
let estilo='';
if(/^aprovado$/i.test(t)) estilo='background:#DDF3E5;color:#236744';
else if(/^pendente$/i.test(t)) estilo='background:#FFF0D5;color:#855B12';
else if(/^reprovado$/i.test(t)) estilo='background:#FAE3E3;color:#923131';
else if(t==='N\u00e3o iniciado') estilo='background:#FCE7E7;color:#B42318';
else if(t==='Em desenvolvimento') estilo='background:#FFF0D5;color:#855B12';
else if(t==='Em valida\u00e7\u00e3o') estilo='background:#DCEBFA;color:#315C84';
else if(t==='Homologado') estilo='background:#DDF3E5;color:#236744';
else if(t==='Em acompanhamento') estilo='background:#EEE7FF;color:#6941C6';
return '<span class="badge" style="'+estilo+'">'+t+'</span>';
}
function shell(t,p,a=''){return $('#content').innerHTML=`<div class="top"><div class="title"><h1>${t}</h1><p>${p}</p></div><div>${a}</div></div><div id="body"></div>`,$('#body')}
function render(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));({home,indicators,bi,validation,actions,followup,meetings}[v])()}
function home(){let b=shell('Visão geral','Seu centro de controle dos indicadores da Comber.');let s=data.summary||{};let st=Object.fromEntries((s.statuses||[]).map(x=>[x.status,x.c]));b.innerHTML=`${!online?'<div class="notice">Ambiente demonstrativo: conecte-se à API publicada para carregar e salvar dados fictícios.</div>':''}<div class="grid home-metrics">
<div class="card metric-card"><div class="metric-head"><div class="label">Indicadores cadastrados</div><div class="metric-icon" aria-hidden="true">▥</div></div><div class="metric">${s.total||0}</div><div class="label">Total registrado</div></div>
<div class="card metric-card"><div class="metric-head"><div class="label">Homologados</div><div class="metric-icon" aria-hidden="true">✓</div></div><div class="metric">${st.Homologado||0}</div><div class="label">Indicadores aprovados</div></div>
<div class="card metric-card"><div class="metric-head"><div class="label">Planos em aberto</div><div class="metric-icon" aria-hidden="true">☷</div></div><div class="metric">${s.open_actions||0}</div><div class="label">Ações a acompanhar</div></div>
<div class="card metric-card"><div class="metric-head"><div class="label">Ações atrasadas</div><div class="metric-icon" aria-hidden="true">◷</div></div><div class="metric">${s.overdue_actions||0}</div><div class="label">Precisam de atenção</div></div>
</div><div class="section"><h2>Indicadores que exigem atenção</h2>${resultsTable(data.results.filter(r=>/crÃ­t|aten/i.test(r.status)).slice(0,8))}</div><div class="section"><h2>Planos de ação</h2>${actionTable(data.actions.slice(0,8))}</div>`}
function resultsTable(rows){if(!rows.length)return '<div class="card empty">Nenhum desvio crítico registrado.</div>';return `<table class="table"><tr><th>Indicador</th><th>PerÃ­odo</th><th>Resultado</th><th>Meta</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${r.indicator_code} — ${r.indicator_name}</td><td>${r.period||'—'}</td><td>${r.actual??'—'}</td><td>${r.target??'—'}</td><td>${badge(r.status)}</td></tr>`).join('')}</table>`}
function status(s){
  const value=String(s||'');
  const norm=value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  let c='blue';
  if(norm.includes('atrasad')) c='bad';
  else if(norm.includes('nao iniciado')) c='neutral-status';
  else if(norm.includes('cancelado')) c='warn';
  else if(norm.includes('em andamento')||norm.includes('desenvolvimento')||norm.includes('validacao')) c='blue';
  else if(norm.includes('concluido')||norm.includes('homologado')||norm.includes('aprovado')||norm.includes('dentro da meta')) c='ok';
  else if(norm.includes('aguardando')||norm.includes('sem resultado')) c='neutral-status';
  else if(norm.includes('ineficaz')||norm.includes('critico')||norm.includes('reprovado')) c='bad';
  else if(norm.includes('parcialmente eficaz')||norm.includes('atencao')||norm.includes('pendente')) c='warn';
  else if(norm.includes('eficaz')) c='ok';
  else if(norm.includes('acompanhamento')) c='blue';
  return '<span class="badge '+c+'">'+value+'</span>';
}
function efficacyBadge(s){
  const value=String(s||'').trim();
  const norm=value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  let c='neutral-status';
  if(norm==='eficaz') c='ok';
  else if(norm==='parcialmente eficaz') c='warn';
  else if(norm==='ineficaz') c='bad';
  return '<span class="badge '+c+'">'+(value||'Aguardando verificação')+'</span>';
}function actionTable(rows, editable=false){
if(!rows.length)return '<div class="card small">Nenhum plano de ação cadastrado.</div>';
const allowed=['N\u00e3o iniciado','Em andamento','Conclu\u00eddo','Cancelado'];
return `<table class="table"><thead><tr><th>Indicador</th><th>Ação</th><th>Método de gestão</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr></thead><tbody>${rows.map(a=>{const current=a.status||'N\u00e3o iniciado';const options=allowed.includes(current)?allowed:[current,...allowed];const control=editable?`<select class="action-status status-select" data-status="${current}" aria-label="Status do plano ${a.id}" onchange="this.dataset.status=this.value;changeActionStatus(${Number(a.id)},this.value)" style="max-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;cursor:pointer">${options.map(s=>`<option value="${s}" ${current===s?'selected':''}>${s}</option>`).join('')}</select>`:status(current);return `<tr><td>${a.indicator_code||'—'}</td><td>${a.title}</td><td>${a.metodo_gestao||'Não informado'}</td><td>${a.owner_name||'—'}</td><td>${a.due_date?String(a.due_date).slice(0,10).split('-').reverse().join('/'):'?'}</td><td>${control}</td></tr>`}).join('')}</tbody></table>`
}
async function changeActionStatus(id,statusValue){
if(!apiOnline){alert('O servidor de teste não está conectado.');return}
try{
const response=await fetch(API+'/actions/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:statusValue})});
const result=await response.json();
if(!response.ok)throw new Error(result.mensagem||'Não foi possível atualizar o status.');
const refreshed=await fetch(API+'/actions');
if(!refreshed.ok)throw new Error('Status salvo, mas não foi possível atualizar a tabela.');
data.actions=await refreshed.json();
render('actions');
}catch(e){
alert(e.message||'Não foi possível atualizar o status. Confira a conexão e tente novamente.');
try{const refreshed=await fetch(API+'/actions');if(refreshed.ok){data.actions=await refreshed.json();render('actions')}}catch(_){}
}
}
function indicators(){let b=shell('Indicadores','Cadastro e organização dos indicadores por departamento.','<button class="btn primary" onclick="openIndicator()">+ Novo indicador</button>');b.innerHTML='<div class="toolbar"><input id="q" placeholder="Buscar código, indicador ou departamento..." oninput="filter()"><select id="sf" onchange="filter()"><option value="">Todos os status</option><option>Não iniciado</option><option>Em desenvolvimento</option><option>Em validação</option><option>Homologado</option><option>Em acompanhamento</option></select></div><div id="it"></div>';filter()}
function filter(){let q=($('#q')?.value||'').toLowerCase(),f=$('#sf')?.value||'';let rows=data.indicators.filter(i=>(!q||`${i.code} ${i.name} ${i.department} ${i.description||''}`.toLowerCase().includes(q))&&(!f||i.status===f));const opts=['Não iniciado','Em desenvolvimento','Em validação','Homologado','Em acompanhamento'];$('#it').innerHTML=rows.length?`<table class="table"><tr><th>Código</th><th>Departamento</th><th>Indicador</th><th>Descrição</th><th>Status</th></tr>${rows.map(i=>`<tr><td><b>${i.code}</b></td><td>${i.department||'—'}</td><td>${i.name}</td><td>${i.description||'—'}</td><td><select class="status-select" data-status="${i.status==="NÃ£o iniciado"?"Não iniciado":i.status}" onchange="setStatusColor(this);changeIndicatorStatus(${Number(i.id)},this.value)" style="max-width:190px;padding:7px;border:1px solid var(--line);border-radius:8px">${opts.map(o=>`<option value="${o}" ${i.status===o?'selected':''}>${o}</option>`).join('')}</select></td></tr>`).join('')}</table>`:'<div class="card empty">Nenhum indicador encontrado.</div>'}
function setStatusColor(el){el.dataset.status=el.value}
async function changeIndicatorStatus(id,status){try{const r=await fetch(API+'/indicators/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});if(!r.ok)throw new Error(await r.text());await load();render('indicators');alert('Status atualizado na demonstração.')}catch(e){alert('Não foi possível salvar o status. A tabela será recarregada.');await load();render('indicators')}}
function bi(){
  const body=shell('Projetos BI','Kanban para acompanhar os projetos de dashboards de todos os departamentos.','<button class="btn primary" onclick="openBI()">+ Novo projeto</button>');
  const stages=['A fazer','Em desenvolvimento','Em validação','Concluído'];
  const canonical=s=>{
    if(s==='Backlog'||s==='A fazer'||!s)return 'A fazer';
    if(s==='Homologação'||s==='Em validação')return 'Em validação';
    return stages.includes(s)?s:'A fazer';
  };
  body.innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;overflow-x:auto;padding:8px 0 16px">${stages.map(stage=>{
    const rows=data.bi.filter(b=>canonical(b.stage||'Backlog')===stage);
    return `<section style="background:#edf2f8;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:220px">
      <h3 style="font-size:13px;margin:5px 2px 12px">${stage} <span class="badge blue">${rows.length}</span></h3>
      ${rows.length?rows.map(b=>`<article class="card" style="padding:11px;margin-bottom:9px">
        <b>${b.name||'Projeto BI'}</b>
        <p class="small">Departamento: ${b.department||'Não informado'}</p>
        <p class="small">Prazo: ${b.due_date||'A definir'}</p>
        <button class="btn" style="margin:5px 0 8px" onclick="openBI(${Number(b.id)})">Editar projeto</button>
        <label class="small">Mover para
          <select style="display:block;width:100%;margin-top:5px;padding:7px;border:1px solid var(--line);border-radius:7px" onchange="moveBI(${Number(b.id)},this.value)">
            ${stages.map(s=>`<option value="${s}" ${canonical(b.stage||'Backlog')===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </label>
      </article>`).join(''):'<p class="small">Nenhum projeto nesta etapa.</p>'}
    </section>`;

}function openBI(id=null){const b=id===null?null:data.bi.find(x=>Number(x.id)===Number(id));if(id!==null&&!b){alert('Projeto não encontrado. Atualize a página e tente novamente.');return}modal.classList.remove('hidden');modal.innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${b?'Editar projeto BI':'Novo projeto BI'}</h2><button class="btn" onclick="closeModal()">Fechar</button></div><input id="biid" type="hidden" value="${b?.id||''}"><div class="form"><label class="full">Nome do projeto<input id="biname" value="${b?.name||''}" placeholder="Ex.: Dashboard de Notas"></label><label>Departamento<select id="bidept"><option>Faturamento</option><option>Compras</option><option>Suprimentos</option><option>Tecnologia</option><option>Projetos</option><option>DHO</option><option>Departamento Pessoal</option></select></label><label>Validadores (separe os nomes por vírgula)<input id="birequester" placeholder="Ex.: Você, Fabiana"></label><label>Data da solicitação<input id="birequestdate" type="date"></label><label>Prioridade<select id="bipriority"><option>Alta</option><option>Média</option><option>Baixa</option></select></label><label class="full">Critérios de aceite<textarea id="bicriteria" placeholder="Como saberemos que o dashboard atende à necessidade?"></textarea></label><label>Etapa<select id="bistage"><option>A fazer</option><option>Em desenvolvimento</option><option>Em validação</option><option>Concluído</option></select></label><label>Responsável<input id="biowner" placeholder="Nome do responsável"></label><label>Prazo<input id="bidate" type="date"></label><label class="full">Pendência / próximo passo<textarea id="bipending" placeholder="O que falta para avançar?"></textarea></label></div><p style="margin-top:16px"><button class="btn primary" onclick="saveBI()">${b?'Salvar alterações':'Cadastrar projeto'}</button></p></div>`;$('#bidept').value=b?.department||'Faturamento';$('#birequester').value=b?.requester||'';$('#birequestdate').value=b?.request_date||'';$( }async function saveBIValidation(event) {
  event.preventDefault();

  const form = document.getElementById('biValidationForm');
  if (!form || !form.reportValidity()) return;

  if (!online) {
    alert('O servidor não está conectado. Nenhum dado foi enviado.');
    return;
  }

  const criteria = [
    { key: 'conceito', label: 'Conceito e informação apresentada' },
    { key: 'fonte', label: 'Fonte dos dados' },
    { key: 'duplicidade', label: 'Duplicidade' },
    { key: 'resultado_fonte', label: 'Resultado BI × fonte' }
  ];

  const payload = {
    project_id: Number(document.getElementById('val_project').value),
    status: document.getElementById('val_status').value,
    data_validacao: document.getElementById('val_date').value,
    validado_por: document.getElementById('val_person').value.trim(),
    observacoes: document.getElementById('val_observations').value.trim()
  };

  for (const c of criteria) {
    payload[c.key] = document.getElementById('val_' + c.key).value;
  }

  const values = criteria.map(c => payload[c.key]);
  const rejected = values.includes('Reprovado');
  const pending = values.includes('Pendente');

  if (rejected) {
    payload.status = 'Reprovado';
  } else if (pending) {
    payload.status = 'Pendente';
  } else {
    payload.status = 'Aprovado';
  }

  

  if (pending) {
    const note = 'Pendências: ' + criteria
      .filter(c => payload[c.key] === 'Pendente')
      .map(c => c.label)
      .join(', ');

    payload.observacoes = payload.observacoes
      ? payload.observacoes + '\n' + note
      : note;
  }

  // Mantém compatibilidade com as colunas antigas do banco.
  payload.formula = payload.conceito;
  payload.completude = payload.fonte;
  payload.filtros = payload.resultado_fonte;
  payload.periodo = payload.resultado_fonte;
  payload.meta = payload.conceito;
  payload.historico = payload.conceito;

  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;

  try {
    const response = await fetch(API + '/bi-validations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(result.mensagem || 'Não foi possível registrar a validação.');
    }

    data.validations = await get('/bi-validations');
    alert('Validação registrada com sucesso. O histórico foi atualizado.');
    render('validation');

  } catch (e) {
    alert(e.message || 'Não foi possível registrar a validação.');
  } finally {
    if (button.isConnected) button.disabled = false;
  }
}

      <button class="btn" onclick="closeModal()">Fechar</button>
    </div>
    <div class="form">
      <label>Indicador
        <select id="ai" required>
          ${data.indicators.map(i => `<option value="${i.id}">${i.code} — ${i.name}</option>`).join('')}
        </select>
      </label>
      <label>Método de gestão
        <select id="ametodo" onchange="renderMethodFields()" required>
          <option value="">Selecione</option>
          <option>PDCA</option><option>SMART</option><option>5W2H</option>
          <option>Semáforo</option><option>Pareto</option><option>5 Porquês</option>
          <option>Combinação de métodos</option><option>Outros métodos</option>
          <option>Não informado</option>
        </select>
      </label>
      <label class="full">Título do plano
        <input id="atitulo" maxlength="300" required placeholder="Resuma a ação principal">
      </label>
      <label>Responsável
        <input id="aowner" placeholder="Nome do responsável">
      </label>
      <label>Prazo geral do plano
        <input id="adeadline" type="date">
      </label>
      <label>Prioridade
        <select id="ap"><option>Alta</option><option selected>Média</option><option>Baixa</option></select>
      </label>
      <label class="full">Resultado esperado
        <textarea id="ar" placeholder="Qual resultado pretende alcançar?"></textarea>
      </label>
      <div id="methodFields" class="full">
        <p>Selecione um método para exibir seus campos específicos.</p>
      </div>
    </div>
    <div style="margin-top:16px">
      <button class="btn primary" onclick="saveAction()">Salvar plano</button>
    </div>
  </div>`;
  renderMethodFields();
}

async function saveAction(){
  try {
    const indicador = document.getElementById('ai').value;
    const metodo = document.getElementById('ametodo').value;
    const titulo = document.getElementById('atitulo').value.trim();

    if (!indicador || !metodo || !titulo) {
      alert('Preencha o indicador, o método de gestão e o título do plano.');
      return;
    }

    const dadosMetodo = {};
    document.querySelectorAll('#methodFields [data-method-field]').forEach(campo => {
      dadosMetodo[campo.dataset.methodField] = campo.value.trim();
    });

    const p = {
      indicadorId: Number(indicador),
      titulo,
      what: dadosMetodo.what || titulo,
      why: dadosMetodo.why || null,
      who: document.getElementById('aowner').value.trim() || dadosMetodo.who || null,
      where: dadosMetodo.where || null,
      whenDate: document.getElementById('adeadline').value || dadosMetodo.when || null,
      how: dadosMetodo.how || null,
      howMuch: dadosMetodo.howMuch || null,
      prioridade: document.getElementById('ap').value,
      resultadoEsperado: document.getElementById('ar').value.trim() || null,
      metodoGestao: metodo,
      dadosMetodo
    };

    const r = await fetch(API + '/actions', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(p)
    });

    if (!r.ok) throw Error(await r.text());

    closeModal();
    await load();
    render('actions');
    alert('Plano salvo na demonstração.');
  } catch(e) {
    alert('Não foi possível salvar: ' + e.message);
  }
}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.view));load();
</script></body></html>
